<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moon — WAY-BE</title>
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body class="wb-moon">
  <header class="wb-nav">
    <div class="wb-nav__inner">
      <a class="wb-nav__game" href="game.html"><img src="assets/img/stars.png" alt="">Game</a>
      <a class="wb-nav__brand" href="index.html"><img src="assets/img/titre.png" alt="WAY-BE"></a>
      <button type="button" class="wb-nav__toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="wb-nav__links" aria-label="Navigation">
        <a href="request.html">Request</a>
        <a href="stats.html">Stats</a>
        <a href="about.html">Team</a>
        <a href="moon.html">Moon</a>
      </nav>
    </div>
  </header>

  <main class="wb-main">
    <span class="wb-badge">Démo static · données graphique mock</span>
    <h1 id="moon-heading">Phase lunaire</h1>

    <form id="moon-form" class="wb-form wb-panel wb-section" aria-labelledby="moon-heading">
      <label for="moon-date">Date</label>
      <input type="date" id="moon-date" name="moon-date" required>
      <button type="submit" class="wb-btn wb-btn--primary">Calculer</button>
    </form>

    <div class="wb-moon-layout">
      <section class="wb-panel" aria-live="polite">
        <h2 class="wb-panel__title">Résultat</h2>
        <p id="moon-selected-date"></p>
        <p>Âge de la lune : <strong><span id="moon-age">—</span></strong> jours</p>
        <p>Phase actuelle : <strong><span id="moon-phase-label">—</span></strong></p>
        <img id="moon-phase-image" src="" alt="Phase de la Lune">
      </section>

      <section class="wb-panel">
        <h2 class="wb-panel__title">Moyennes vélos · pleine lune vs autres jours</h2>
        <div class="wb-chart-wrap">
          <canvas id="moonChart" aria-label="Graphique circulaire des moyennes de vélos"></canvas>
        </div>
      </section>
    </div>
  </main>

  <footer class="wb-footer"><p>© 2024 Groupe C02 — WAY-BE · Projet Bac 1 UCLouvain/EPL · Vitrine demo</p></footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/moon.js"></script>
</body>
</html>

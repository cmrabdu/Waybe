<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats — WAY-BE</title>
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body>
  <header class="wb-nav">
    <div class="wb-nav__inner">
      <a class="wb-nav__game" href="game.html"><img src="assets/img/stars.png" alt="">Game</a>
      <a class="wb-nav__brand" href="index.html"><img src="assets/img/titre.png" alt="WAY-BE"></a>
      <button type="button" class="wb-nav__toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="wb-nav__links" aria-label="Navigation">
        <a href="request.html">Request</a>
        <a href="stats.html">Stats</a>
        <a href="about.html">Team</a>
        <a href="moon.html">Moon</a>
      </nav>
    </div>
  </header>

  <main class="wb-main">
    <span class="wb-badge">Démo interactive — données d'exemple</span>
    <h1>Stats</h1>

    <div class="wb-grid wb-grid--3col">
      <section class="wb-panel">
        <h2 class="wb-panel__title">Nombres de rues par ville</h2>
        <ul id="streets-by-city" class="wb-list"></ul>
      </section>

      <section class="wb-panel">
        <h2 class="wb-panel__title">Entrées par table</h2>
        <ul id="table-counts" class="wb-list"></ul>
      </section>

      <section class="wb-panel">
        <h2 class="wb-panel__title">Classement des villes les plus cyclistes</h2>
        <ol id="bike-ranking" class="wb-list wb-list--ranked"></ol>
      </section>
    </div>
  </main>

  <footer class="wb-footer"><p>© 2024 Groupe C02 — WAY-BE · Projet Bac 1 UCLouvain/EPL · Vitrine demo</p></footer>

  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/nav.js"></script>
  <script>
    (function () {
      'use strict';

      var streetsList = document.getElementById('streets-by-city');
      var tableList = document.getElementById('table-counts');
      var bikeList = document.getElementById('bike-ranking');

      WAYBE_DEMO.cities
        .slice()
        .sort(function (a, b) { return b.streetsCount - a.streetsCount; })
        .forEach(function (city) {
          var li = document.createElement('li');
          li.textContent = city.name + ' : ' + city.streetsCount;
          streetsList.appendChild(li);
        });

      Object.keys(WAYBE_DEMO.tableStats).forEach(function (key) {
        var li = document.createElement('li');
        li.textContent = 'Entrées ' + key + ' : ' + WAYBE_DEMO.tableStats[key];
        tableList.appendChild(li);
      });

      WAYBE_DEMO.bikeRanking.forEach(function (entry) {
        var li = document.createElement('li');
        li.textContent = entry[0] + ' : ' + entry[1].toFixed(2);
        bikeList.appendChild(li);
      });
    })();
  </script>
</body>
</html>
